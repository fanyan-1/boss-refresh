// 根据语音名/URI 推断性别（f=女, m=男, ?=未知）
function _voiceGender(v){
  const n = (v.name || '') + ' ' + (v.voiceURI || '') + ' ' + (v.lang || '');
  if (/female|女/i.test(n)) return 'f';
  if (/male|男/i.test(n)) return 'm';
  if (/xiaoxiao|xiaoyi|xiaobo|xiaomeng|xiaorui|xiaoshuang|xiaomo|xiaoxuan|xiaona|yaoyao|huihui|tingting|ruxue/i.test(n)) return 'f';
  if (/yunxi|yunyang|yunjian|yunhao|kangkang|yang|jian|hao/i.test(n)) return 'm';
  return '?';
}
// 在候选池里挑最合适的中文语音：gender 指定偏好性别（'f'/'m'/null 默认偏女）
function _bestVoice(pool, gender){
  let best = null, bestScore = -1;
  for (const v of pool){
    const n = (v.name || '') + ' ' + (v.voiceURI || '');
    let s = 0;
    if (/neural|在线|云|online|natural/i.test(n)) s += 3;
    const g = _voiceGender(v);
    if (gender === 'f' && g === 'f') s += 4;
    else if (gender === 'm' && g === 'm') s += 4;
    else if (gender === null && g === 'f') s += 2;
    else if (g !== '?' && g !== gender) s -= 6;   // 性别不符，降权
    if (/zh|chinese|中文/i.test(v.lang || '')) s += 1;
    if (s > bestScore){ bestScore = s; best = v; }
  }
  return best;
}
function _pickVoices(){
  try {
    if (!('speechSynthesis' in window)) return;
    const vs = window.speechSynthesis.getVoices() || [];
    const base = vs.filter(function(v){ return /zh|chinese|中文/i.test(v.lang || ''); });
    const pool = base.length ? base : vs;
    _voiceFemale = _bestVoice(pool, 'f');
    _voiceMale   = _bestVoice(pool, 'm');
    if (!_voiceFemale) _voiceFemale = _bestVoice(pool, null);  // 兜底：无女声则用最佳中文语音
    if (!_voiceMale)   _voiceMale   = _bestVoice(pool, null);
  } catch(e){}
}

function speakFallback(name){
  try {
    if (!('speechSynthesis' in window)) return;
    const isFemale = FEMALE_BOSSES.has(name);
    const text = isFemale ? (name + '即将刷新，会爆粉的哦') : (name + '即将刷新，小臂噶不爆粉');
    const voice = isFemale ? _voiceFemale : _voiceMale;
    const u = new SpeechSynthesisUtterance(text);

    u.rate = 1.0; u.pitch = 1.0; u.volume = 1.0;   // 浏览器限制：音量上限 1.0
    window.speechSynthesis.speak(u);
  } catch(e){}
}

function getUids(){

  if (!raw) return [];

    }
  }).catch(function(e){
    // 走到这里通常是本地服务没跑起来（没用 run.bat 打开，或服务窗口已关）
    pstatEl.textContent = '❌ 连接本地服务失败：' + (e && e.message ? e.message : e) +
      '（请通过 run.bat 打开报告并保持服务窗口运行；WxPusher 推送依赖本地服务代理）';
    pstatEl.style.color = '#c0392b';
  });
}

function pad(n){ return String(n).padStart(2, '0'); }
// 取“北京时间”（UTC+8），不依赖打开页面的机器所在时区
function beijingDate(){
  const d = new Date();
  const utc = d.getTime() + d.getTimezoneOffset() * 60000;
  return new Date(utc + 8 * 3600 * 1000);
}
function fmtBJ(d){
  return d.getFullYear() + '年' + pad(d.getMonth()+1) + '月' + pad(d.getDate()) + '日 '
       + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function render(){
  clockEl.textContent = '当前北京时间：' + fmtBJ(beijingDate());
  const now = Date.now();
  const KEEP_MS = 300000; // 刷新后延迟 5 分钟再自动隐藏
  // 全局 live（跨所有天合并，按时间升序），用于确定“下一个即将刷新”与统计
  let allLive = [];
  DAYS.forEach(function(day){ day.events.forEach(function(e){ if (e.ts + KEEP_MS > now) allLive.push(e); }); });
  allLive.sort(function(a, b){ return a.ts - b.ts; });
  // 全局下一个即将刷新：第一个“尚未出现”的事件
  let nextTs = null;
  for (let k = 0; k < allLive.length; k++){
    const e = allLive[k];
    if (!(now >= e.ts && (now - e.ts) < KEEP_MS)){ nextTs = e.ts; break; }
  }
  let appearingCount = 0, futureCount = 0;
  DAYS.forEach(function(day, di){
    const blockEl = document.getElementById('day-' + di);
    const tbody = document.getElementById('rows-' + di);
    tbody.innerHTML = '';
    const live = day.events.filter(function(e){ return e.ts + KEEP_MS > now; })
                            .sort(function(a, b){ return a.ts - b.ts; });
    if (live.length === 0){ blockEl.style.display = 'none'; return; }
    blockEl.style.display = '';
    live.forEach(function(e, i){
      // 正在出现：刷新时间已到、且距现在不足 2 分钟
      const isAppearing = (now >= e.ts && (now - e.ts) < KEEP_MS);
      // 即将刷新的下一个：全局列表中第一个尚未出现的事件
      const isNext = (nextTs !== null && e.ts === nextTs);
      if (isAppearing) appearingCount++; else futureCount++;
      // 进入“提前播报窗口”后，每 1 分钟播报一次“xx即将刷新”；刷新后不再播报（KEEP_MS 内转入“正在出现”）
      const toSpawn = e.ts - now;
      if (!isAppearing && toSpawn > 0 && toSpawn <= SPEAK_BEFORE_MS){
        const key = e.name + '@' + e.ts;
        const lastT = lastSpoken.has(key) ? lastSpoken.get(key) : -Infinity;
        if (now - lastT >= ANNOUNCE_INTERVAL_MS){
          lastSpoken.set(key, now);
          speak(e.name);
        }
        // 同一时间窗口内推送微信（独立去重：推送与语音互不影响）
        if (!pushed.has(key)){
          pushed.add(key);
          pushWechat(e.name);
        }
      }
      // 爆粉首领 = 粉色底层；非爆粉 = 紫色底层（底层固定，不受刷新状态影响）
      const isBaofen = BAOFEN_BOSSES.has(e.name);
      let rowBg = isBaofen ? '#ffc2da' : '#d4b9ff';
      // 正在出现：红色文字加粗 + 左侧红条；下一个即将刷新：绿色文字加粗 + 左侧绿条
      let rowColor = '', borderLeft = '4px solid transparent', cdColor = '#1a6fb0', fontW = '400', probColor = e.prob_color;
      if (isAppearing){
        rowColor = '#c0392b'; borderLeft = '4px solid #c0392b'; cdColor = '#c0392b'; fontW = '700'; probColor = '#c0392b';
      } else if (isNext){
        rowColor = '#1a7f37'; borderLeft = '4px solid #1a7f37'; cdColor = '#1a7f37'; fontW = '700'; probColor = '#1a7f37';
      }
      let cd;
      if (isAppearing){
        const rem = e.ts + KEEP_MS - now; // 距 2 分钟宽限期结束的剩余时间
        const rh = Math.floor(rem / 3600000);
        const rm = Math.floor((rem % 3600000) / 60000);
        const rs = Math.floor((rem % 60000) / 1000);
        cd = '刷新中 ' + (rh > 0 ? rh + '小时' : '') + rm + '分' + pad(rs) + '秒';
      } else {
        const left = e.ts - now;
        const h = Math.floor(left / 3600000);
        const m = Math.floor((left % 3600000) / 60000);
        const s = Math.floor((left % 60000) / 1000);
        cd = (h > 0 ? h + '小时' : '') + m + '分' + pad(s) + '秒';
      }
      const tr = document.createElement('tr');
      tr.style.background = rowBg;
      tr.style.color = rowColor;
      tr.style.fontWeight = fontW;
      tr.innerHTML = '<td style="border-left:' + borderLeft + '">' + (i+1) + '</td>'
                   + '<td>' + e.name + '</td>'
                   + '<td>' + e.time + '</td>'
                   + '<td style="font-weight:600;text-align:center;color:' + probColor + '">' + e.prob_label + '</td>'
                   + '<td style="text-align:center;color:' + cdColor + '">' + cd + '</td>';
      tbody.appendChild(tr);
    });
  });
  const total = allLive.length;
  if (total === 0){
    emptyEl.style.display = 'block';
    statusEl.textContent = '实时刷新中：当前没有即将刷新的首领（请重新运行脚本读取最新游戏数据）';
  } else {
    emptyEl.style.display = 'none';
    statusEl.textContent = '实时刷新中：共 ' + total + ' 条（已出现 ' + appearingCount + ' 条，即将刷新 ' + futureCount + ' 条；刷新超 5 分钟自动隐藏）';
  }
}
// —— 微信推送配置（WxPusher）：appToken + 接收 UID，localStorage 持久化，覆盖内置值 ——
const wxappEl = document.getElementById('wxapp');
const wxuidEl = document.getElementById('wxuid');
const pstatEl = document.getElementById('pstat');
const vstatEl = document.getElementById('vstat');
try {
  const a = localStorage.getItem('wx_app_token'); if (a) wxappEl.value = a;
  const u = localStorage.getItem('wx_uids'); if (u) wxuidEl.value = u;
} catch(e){}
document.getElementById('psave').addEventListener('click', function(){
  try {
    const a = wxappEl.value.trim();
    const u = wxuidEl.value.trim();
    if (a && u){ localStorage.setItem('wx_app_token', a); localStorage.setItem('wx_uids', u); pstatEl.textContent = '已保存，临近刷新将推送微信'; }
    else { localStorage.removeItem('wx_app_token'); localStorage.removeItem('wx_uids'); pstatEl.textContent = '已清除，将使用脚本内置配置'; }
  } catch(e){ pstatEl.textContent = '保存失败'; }
});
document.getElementById('ptest').addEventListener('click', function(){
  testPushWechat();
});
document.getElementById('vtestF').addEventListener('click', function(){
  testSpeakFemale();
});
document.getElementById('vtestM').addEventListener('click', function(){
  testSpeakMale();
});

setInterval(render, 1000);
render();

</script>
